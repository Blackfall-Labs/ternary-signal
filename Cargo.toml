[package]
name = "ternary-signal"
version = "0.3.0"
edition = "2021"
description = "Ternary signal types for neuromorphic systems — polarity x magnitude x multiplier, 3-byte and 1-byte packed formats"
license = "MIT"
repository = "https://github.com/blackfall-labs/ternary-signal"
keywords = ["ternary", "neural", "signal", "cognitive", "neuromorphic"]
categories = ["science", "simulation"]

[dependencies]
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = ["serde"]
